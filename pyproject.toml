[build-system]
requires = ["setuptools>=45", "wheel", "build>=0.7.0"]
build-backend = "setuptools.build_meta"

[project]
name = "slurmrest"
dynamic = ["version"]
description = "A comprehensive Slurm REST API client"
readme = "README.md"
requires-python = ">=3.7"
license = {text = "MIT"}
keywords = ["slurm", "rest", "api", "client", "hpc"]
authors = [
    {name = "Jose Luna", email = "jose@lunajos.com"}
]
maintainers = [
    {name = "Jose Luna", email = "jose@lunajos.com"}
]

[tool.black]
line-length = 100
target-version = ['py37']
include = '\.pyi?$'

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 100

[tool.mypy]
python_version = "3.7"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
